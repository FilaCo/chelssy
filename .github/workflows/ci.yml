name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure, build, test
        run: cmake --workflow --preset test

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      # Clang >= 19 is required: with libstdc++, std::expected is guarded by
      # __cpp_concepts >= 202002L, which older Clang does not define.
      - name: Install clang 20 (apt.llvm.org)
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
      # llvm-cov/llvm-profdata are pinned to the same version as the
      # compiler; the runner's preinstalled (older) llvm-cov cannot read
      # clang-20 profile data.
      - name: Configure
        run: >
          cmake --preset coverage
          -DCMAKE_CXX_COMPILER=clang++-20
          -DLLVM_COV_PATH=/usr/bin/llvm-cov-20
          -DLLVM_PROFDATA_PATH=/usr/bin/llvm-profdata-20
      - name: Build & run instrumented tests
        run: cmake --build --preset coverage-run
      - name: Report coverage
        run: cmake --build --preset coverage-report
      # The ccov-all-export target emits llvm-cov JSON; Codecov wants lcov,
      # so export directly from the profdata the report step already built.
      - name: Export lcov for Codecov
        run: >
          llvm-cov-20 export
          `cat build/coverage/ccov-data/all-objects.list`
          -instr-profile=build/coverage/ccov-data/ccov-all.profdata
          -format=lcov
          -ignore-filename-regex='.*/tests/.*'
          -ignore-filename-regex='.*/_deps/.*'
          > build/coverage/coverage.lcov
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage/coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/ccov/

  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fen_fuzz
            binary: build/fuzz/tests/Fuzz/Fen/fen_fuzz
            seeds: tests/Fuzz/Fen/corpus
          - target: board_fuzz
            binary: build/fuzz/tests/Fuzz/Board/board_fuzz
            seeds: tests/Fuzz/Board/corpus tests/Fuzz/Fen/corpus
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      # Clang >= 19 is required: with libstdc++, std::expected is guarded by
      # __cpp_concepts >= 202002L, which older Clang does not define.
      - name: Install clang 20 (apt.llvm.org)
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
      - name: Configure
        run: cmake --preset fuzz -DCMAKE_CXX_COMPILER=clang++-20
      - name: Build
        run: cmake --build build/fuzz --target ${{ matrix.target }}
      - name: Run ${{ matrix.target }}
        run: >
          mkdir corpus_work;
          ./${{ matrix.binary }}
          corpus_work
          ${{ matrix.seeds }}
          -dict=tests/Fuzz/Fen/Fen.dict
          -max_total_time=60
          -print_final_stats=1
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-crashes
          path: |
            crash-*
            oom-*
            timeout-*
          if-no-files-found: ignore
